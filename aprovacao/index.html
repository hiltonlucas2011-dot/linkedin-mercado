<title>Posts do LinkedIn Pessoal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna; cada post aparece como prévia do feed do LinkedIn, com a decisão logo abaixo. */
:root {
  --bg: #F3F2EF; --surface: #FFFFFF; --ink: #1B1F24; --text: #303740; --muted: #67707B; --line: #E2E1DC;
  --accent: #0A66C2; --accent-ink: #0A4F96; --ok: #1E7B4A; --ok-soft: #E3F3EA;
  --warn: #A15C00; --warn-soft: #FDF0DC; --bad: #B3261E; --bad-soft: #FBE7E5; --info: #0A4F96; --info-soft: #E5EEF8;
  --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1C1F24; --ink: #F2F3F5; --text: #D3D7DD; --muted: #9AA3AE; --line: #2E333A;
  --accent: #70B5F9; --accent-ink: #9CCBFA; --ok: #6FD39C; --ok-soft: #173326;
  --warn: #F5B85C; --warn-soft: #3A2B14; --bad: #F2867E; --bad-soft: #3A1C1A; --info: #9CCBFA; --info-soft: #18283B;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1C1F24; --ink: #F2F3F5; --text: #D3D7DD; --muted: #9AA3AE; --line: #2E333A;
  --accent: #70B5F9; --accent-ink: #9CCBFA; --ok: #6FD39C; --ok-soft: #173326;
  --warn: #F5B85C; --warn-soft: #3A2B14; --bad: #F2867E; --bad-soft: #3A1C1A; --info: #9CCBFA; --info-soft: #18283B;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5;
       padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 620px; margin: 0 auto; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(26px, 6vw, 32px); line-height: 1.15; color: var(--ink); margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); }
.notice strong { color: var(--ink); }

.post { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.post.done { opacity: .75; }
.status-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.when { font-weight: 600; color: var(--ink); }
.chip { font-weight: 600; font-size: 12px; padding: 4px 10px; border-radius: 999px; margin-left: auto; }
.s-pendente, .s-ajuste { background: var(--warn-soft); color: var(--warn); }
.s-aprovado { background: var(--ok-soft); color: var(--ok); }
.s-agendado { background: var(--info-soft); color: var(--info); }
.s-reprovado { background: var(--bad-soft); color: var(--bad); }

.author { display: flex; gap: 10px; align-items: center; padding: 14px 16px 6px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.author b { color: var(--ink); display: block; font-size: 14px; }
.author span { color: var(--muted); font-size: 12px; }
.body { padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
textarea { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 8px; margin: -8px; width: calc(100% + 16px); resize: vertical; line-height: 1.55; }
textarea.editing { border-color: var(--line); background: var(--bg); }
textarea[readonly] { cursor: default; }
textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 12px; color: var(--muted); align-self: flex-end; }
.photo { width: 100%; aspect-ratio: 4 / 5; max-width: 100%; background: var(--line); display: block; object-fit: cover; }
.comment { margin: 12px 16px 14px; background: var(--bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.comment small { font-weight: 600; color: var(--muted); font-size: 12px; }
.comment textarea { min-height: 54px; font-size: 13px; }
.source { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.source a { color: var(--accent-ink); }

.decide { border-top: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 1.5px solid transparent; }
.btn-ok { background: var(--accent); color: #fff; }
.btn-alt { background: transparent; color: var(--accent-ink); border-color: var(--accent); }
.btn-ghost { background: transparent; color: var(--bad); padding-inline: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.fb textarea { margin: 0; width: 100%; min-height: 76px; border-color: var(--line); background: var(--bg); }
.feedback-note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.msg { font-size: 13px; color: var(--muted); min-height: 1em; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: filter .15s; } .btn:hover:not(:disabled) { filter: brightness(1.08); } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">LinkedIn pessoal · varejo e consumo</div>
    <h1>Post da semana para aprovar</h1>
    <p class="lead">Toda quinta à noite chega um post novo. Você pode editar o texto e o comentário da fonte antes de aprovar. Aprovado até 11h, sai na sexta às 11h30; depois disso, às 17h.</p>
  </header>
  <div id="list"><div class="notice" id="empty"><strong>Carregando…</strong></div></div>
</div>

<script>
const STATUS = {
  pendente: ['Aguardando você', 's-pendente'], ajuste: ['Ajuste pedido', 's-ajuste'],
  aprovado: ['Aprovado · vai para o Buffer', 's-aprovado'], agendado: ['Agendado no Buffer', 's-agendado'],
  reprovado: ['Descartado', 's-reprovado'],
};
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k) n.append(typeof k === 'string' ? document.createTextNode(k) : k);
  return n;
};
const fmt = iso => { const d = new Date(iso); if (isNaN(d)) return 'Sem data';
  return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', weekday: 'long', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(d).replace(/^./, c => c.toUpperCase()); };
const safeUrl = u => typeof u === 'string' && u.startsWith('https://') ? u : null;
const safeImg = u => typeof u === 'string' && (u.startsWith('/_blob/') || u.startsWith('https://')) ? u : null;
const autosize = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };

let db = null, canWrite = false, posts = [];
const drafts = {}, ui = {};

function render() {
  const list = document.getElementById('list');
  if (!posts.length) { list.replaceChildren(el('div', { class: 'notice' }, el('strong', { text: 'Nenhum post por enquanto.' }), el('br'), 'O primeiro chega na quinta à noite.')); return; }
  list.replaceChildren(...posts.map(renderPost));
  list.querySelectorAll('textarea').forEach(autosize);
}

function renderPost(p) {
  const [label, cls] = STATUS[p.status] || STATUS.pendente;
  const open = p.status === 'pendente', editable = open && canWrite;
  const d = drafts[p.id] || (drafts[p.id] = { texto: p.texto || '', comentario: p.primeiro_comentario || '' });
  const u = ui[p.id] || (ui[p.id] = { fb: false });
  const changed = () => d.texto !== (p.texto || '') || d.comentario !== (p.primeiro_comentario || '');

  const texto = el('textarea', { id: `t-${p.id}`, 'aria-label': 'Texto do post', readonly: !editable, class: editable ? 'editing' : '' });
  texto.value = d.texto;
  const count = el('span', { class: 'count', text: `${d.texto.length} caracteres` });
  const edited = el('span', { class: 'count', text: '' });
  const refresh = () => { count.textContent = `${d.texto.length} caracteres`; edited.textContent = changed() ? 'Editado por você: será salvo ao aprovar.' : ''; };
  texto.addEventListener('input', () => { d.texto = texto.value; autosize(texto); refresh(); });
  const com = el('textarea', { id: `c-${p.id}`, 'aria-label': 'Primeiro comentário (fonte)', readonly: !editable, class: editable ? 'editing' : '' });
  com.value = d.comentario;
  com.addEventListener('input', () => { d.comentario = com.value; autosize(com); refresh(); });
  refresh();

  const img = safeImg(p.preview_url);
  const src = safeUrl(p.fonte_url);
  const kids = [
    el('div', { class: 'status-bar' }, el('span', { class: 'when', text: fmt(p.agendado_para || p.data_publicacao) }), el('span', { class: 'chip ' + cls, text: label })),
    el('div', { class: 'author' }, el('div', { class: 'avatar', 'aria-hidden': 'true', text: 'HL' }), el('div', {}, el('b', { text: 'Hilton Lucas' }), el('span', { text: 'Prévia do post' }))),
    el('div', { class: 'body' }, texto, count, edited),
    img ? el('img', { class: 'photo', src: img, alt: p.alt || 'Foto do post' }) : el('div', { class: 'photo', role: 'img', 'aria-label': 'Foto indisponível' }),
    el('div', { class: 'comment' }, el('small', { text: 'Primeiro comentário' }), com,
      el('span', { class: 'source' }, 'Fonte: ', src ? el('a', { href: src, target: '_blank', rel: 'noopener', text: p.fonte_nome || src }) : (p.fonte_nome || 'não informada'))),
  ];

  const decide = el('div', { class: 'decide' });
  if (p.status === 'ajuste' && p.feedback) decide.append(el('div', { class: 'feedback-note', text: 'Seu pedido: ' + p.feedback + ' (o agente refaz e devolve para cá).' }));
  if (editable) {
    const msg = el('div', { class: 'msg', 'aria-live': 'polite' });
    const buttons = [];
    const save = async (patch, ok) => {
      buttons.forEach(b => b.disabled = true); msg.textContent = 'Salvando…';
      try { await db.doc('posts/' + p.id).update({ ...patch, decidido_em: new Date().toISOString() }); msg.textContent = ok; }
      catch (e) { msg.textContent = e && e.code === 'invalid_argument' ? 'Você não tem permissão para decidir este post.' : 'Não deu para salvar agora. Tente de novo.'; buttons.forEach(b => b.disabled = false); }
    };
    if (u.fb) {
      const fb = el('textarea', { id: `fb-${p.id}`, placeholder: 'O que mudar? Ex.: outra foto, gancho mais forte, texto mais curto…', 'aria-label': 'Pedido de ajuste' });
      const send = el('button', { class: 'btn btn-ok', onclick: () => { const t = fb.value.trim(); if (!t) { msg.textContent = 'Escreva o que você quer mudar.'; fb.focus(); return; } u.fb = false; save({ status: 'ajuste', feedback: t }, 'Pedido enviado.'); } }, 'Enviar pedido');
      const cancel = el('button', { class: 'btn btn-alt', onclick: () => { u.fb = false; render(); } }, 'Cancelar');
      buttons.push(send, cancel);
      decide.append(el('div', { class: 'fb' }, fb), el('div', { class: 'actions' }, send, cancel), msg);
    } else {
      const ok = el('button', { class: 'btn btn-ok', onclick: () => save({ status: 'aprovado', texto: d.texto, primeiro_comentario: d.comentario, editado_por_voce: changed() }, 'Aprovado.') }, 'Aprovar');
      const adj = el('button', { class: 'btn btn-alt', onclick: () => { u.fb = true; render(); } }, 'Pedir ajuste');
      const no = el('button', { class: 'btn btn-ghost', onclick: () => save({ status: 'reprovado' }, 'Descartado.') }, 'Descartar');
      buttons.push(ok, adj, no);
      decide.append(el('div', { class: 'actions' }, ok, adj, no), msg);
    }
  } else if (open) decide.append(el('div', { class: 'msg', text: 'Só o dono desta página pode aprovar.' }));
  if (decide.childNodes.length) kids.push(decide);
  return el('article', { class: 'post' + (open ? '' : ' done'), id: 'post-' + p.id }, ...kids);
}

(async () => {
  const empty = document.getElementById('empty');
  db = await claude.use('db');
  if (!db) { empty.replaceChildren(el('strong', { text: 'Abra esta página no claude.ai, com sua conta, para ver e aprovar os posts.' })); return; }
  const user = await claude.use('user');
  canWrite = user ? await user.canEdit() : true;
  const timer = setTimeout(() => empty.replaceChildren(el('strong', { text: 'Os posts ainda não carregaram.' }), el('br'), 'A página atualiza sozinha quando chegar.'), 10000);
  db.collection('posts').orderBy('data_publicacao', 'desc').limit(20).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    posts = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    for (const p of posts) if (p.status !== 'pendente') delete drafts[p.id];
    render();
  }, () => { clearTimeout(timer); empty.replaceChildren(el('strong', { text: 'Não foi possível carregar. Recarregue a página.' })); });
})();
</script>
